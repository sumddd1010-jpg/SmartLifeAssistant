
name: Build Smart Life Assistant APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'SmartLifeAssistant_Android_Project.zip'
      - '.github/workflows/android-build.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get project
        uses: actions/checkout@v4

      - name: Extract Android project
        run: |
          mkdir extracted
          unzip -q SmartLifeAssistant_Android_Project.zip -d extracted
          PROJECT_DIR=$(dirname "$(find extracted -name settings.gradle.kts -print -quit)")
          cp -a "$PROJECT_DIR"/. .

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: gradle assembleDebug

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: SmartLifeAssistant-APK
          path: app/build/outputs/apk/debug/*.apk
